site_name: TDB Enterprise
site_description: The Data-Bridge — secure, auditable API layer over your data sources
site_author: TDB Project
site_url: https://docs.tdb.jiracorp.co.in
docs_dir: docs

theme:
  name: material
  palette:
    # Dark FIRST, and deliberately not gated on prefers-color-scheme. The landing
    # page at tdb.jiracorp.co.in is dark-only, so following the OS setting meant a
    # reader on a light-mode machine crossed from a dark site into a white one and
    # read it as an unstyled page. Dark is the product's look; light stays one
    # click away for anyone who wants it.
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow

extra_css:
  - stylesheets/tdb.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  # Needed for the :material-*: / :octicons-*: icon shortcodes used by the
  # grid cards on the index page — without it they render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

